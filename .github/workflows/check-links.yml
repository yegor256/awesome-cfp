---
# yamllint disable rule:line-length
name: check-links
'on':
  schedule:
    - cron: '38 1 * * *'
  push:
    branches:
      - master
    paths:
      - 'README.md'
  pull_request:
    paths:
      - 'README.md'
  workflow_dispatch:
jobs:
  lychee:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept 200..=399,403,429 README.md
          fail: true
